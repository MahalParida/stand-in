packages:
  - packages/*
  - apps/*
  - eval

# pnpm 10+ blocks dependency build scripts by default; allow the native ones we rely on.
# better-sqlite3 >=13 ships N-API prebuilds (prebuilds/<platform>.node) and has no install
# script; pnpm would otherwise infer `node-gyp rebuild` from binding.gyp, so it is explicitly
# NOT allowed to build.
allowBuilds:
  esbuild: true
  better-sqlite3: false
